[project]
name = "product-service"
version = "1.0.0"
description = "Product catalog: categories, brands, products, filtering, pagination, catalog events"
requires-python = ">=3.12"
dependencies = [
    "ecom-common",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
]

[tool.uv.sources]
ecom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_service"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "fakeredis>=2.26",
]
