[project]
name = "api-gateway"
version = "1.0.0"
description = "Edge gateway: JWT validation, RBAC, routing, rate limiting, circuit breaking, correlation IDs"
requires-python = ">=3.12"
dependencies = [
    "ecom-common",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
ecom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "fakeredis>=2.26",
    "respx>=0.22",
]
