[project]
name = "inventory-service"
version = "1.0.0"
description = "Product inventory & stock service: reservations, stock ledger, low-stock/out-of-stock reporting, event-driven integration"
requires-python = ">=3.12"
dependencies = [
    "ecom-common",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
]

[tool.uv.sources]
ecom-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_service"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "fakeredis>=2.26",
    "aiosqlite>=0.20",
]
