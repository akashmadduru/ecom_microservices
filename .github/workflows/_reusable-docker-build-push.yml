name: Reusable / Docker build + push

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context, relative to repo root
        required: true
        type: string
      dockerfile-path:
        description: Path to the Dockerfile, relative to repo root
        required: true
        type: string
      image-name:
        description: Full image name without tag (e.g. ghcr.io/owner/ecom-microservices-product-service)
        required: true
        type: string
      push:
        description: Whether to actually push (true only on merge to main)
        required: true
        type: boolean

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "sha_tag=${{ inputs.image-name }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${{ inputs.image-name }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile-path }}
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
