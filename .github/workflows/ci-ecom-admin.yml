name: ecom-admin CI

# Deliberately no python/libs/ecom_common or python/pyproject.toml in these path filters —
# this component must never fire on a Python-only change, and vice versa.
on:
  pull_request:
    paths:
      - 'vue/apps/ecom-admin/**'
      - 'vue/packages/lib/**'
      - 'vue/packages/core/**'
      - '.github/workflows/ci-ecom-admin.yml'
      - '.github/workflows/_reusable-node-app-ci.yml'
      - '.github/workflows/_reusable-docker-build-push.yml'
  push:
    branches: [main]
    paths:
      - 'vue/apps/ecom-admin/**'
      - 'vue/packages/lib/**'
      - 'vue/packages/core/**'
      - '.github/workflows/ci-ecom-admin.yml'
      - '.github/workflows/_reusable-node-app-ci.yml'
      - '.github/workflows/_reusable-docker-build-push.yml'

concurrency:
  group: ci-ecom-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    uses: ./.github/workflows/_reusable-node-app-ci.yml
    permissions:
      contents: read
    with:
      workspace-root: vue
      workspace-name: ecom-admin
      # No e2e coverage for ecom-admin yet — deliberate, not manufactured parity.
      run-e2e: false

  docker:
    needs: [lint-test]
    uses: ./.github/workflows/_reusable-docker-build-push.yml
    permissions:
      contents: read
      packages: write
    with:
      # `vue` (the npm workspace root) as context, not just apps/ecom-admin —
      # this app depends on packages/lib and packages/core as workspace
      # siblings, but nothing outside vue/ is needed.
      context: vue
      dockerfile-path: vue/apps/ecom-admin/Dockerfile
      image-name: ghcr.io/${{ github.repository_owner }}/ecom-microservices-ecom-admin
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
