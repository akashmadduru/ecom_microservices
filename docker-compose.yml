# Full platform stack. Infra + services added phase by phase.
# JWT_SECRET must be provided: `JWT_SECRET=... docker compose up -d` or via .env at repo root.
# All other credentials below have dev-only fallback defaults (via ${VAR:-default})
# so `docker compose up` still works out of the box locally; override every one
# of them via a root .env file or your deployment platform's secret manager for
# staging/production. See .env.example.

x-service-env: &service-env
  REDIS_URL: redis://redis:6379
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment or a root .env file}
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: ecom-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 48
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - ecom_network

  api-gateway:
    build:
      context: .
      dockerfile: python/services/api_gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: api-gateway
    ports:
      - "8080:8080"
    networks:
      - ecom_network
  postgres:
    image: postgres:17-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Per-service DB passwords, read by deploy/postgres/init-databases.sh.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_user}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-product_user}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_user}
    ports:
      - "5441:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecom_network

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecom_network

  auth-service:
    build:
      context: .
      dockerfile: python/services/auth_service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://auth_user:${AUTH_DB_PASSWORD:-auth_user}@postgres:5432/auth_db
    ports:
      - "8001:8001"
    networks:
      - ecom_network

  product-service:
    build:
      context: .
      dockerfile: python/services/product_service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql+asyncpg://product_user:${PRODUCT_DB_PASSWORD:-product_user}@postgres:5432/product_db
      # Only consumed by the manual POST /admin/products/seed endpoint; the
      # startup auto-seed hook below uses SEED_CATALOG_DIR/seed_full_catalog
      # instead, not the CSV path.
      SEED_CSV_PATH: /app/seed/products.csv
      SEED_BATCH_SIZE: ${SEED_BATCH_SIZE:-500}
      AUTO_SEED_ON_STARTUP: ${AUTO_SEED_ON_STARTUP:-true}
      SEED_CATALOG_DIR: /app/seed/catalog
    ports:
      - "8003:8003"
    networks:
      - ecom_network

  inventory-service:
    build:
      context: .
      dockerfile: python/services/inventory_service/Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: inventory-service
      DATABASE_URL: postgresql+asyncpg://inventory_user:${INVENTORY_DB_PASSWORD:-inventory_user}@postgres:5432/inventory_db
    ports:
      - "8004:8004"
    networks:
      - ecom_network

networks:
  ecom_network:
    driver: bridge

volumes:
  postgres_data:
