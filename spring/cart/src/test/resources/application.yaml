spring:
  application:
    name: cart-test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true

  flyway:
    enabled: false

  cloud:
    stream:
      bindings:
        cartEventProducer-out-0:
          destination: cart-events

server:
  port: 0
