spring:
  application:
    name: cart

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cart_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      bindings:
        # Cart service saga event bindings
        checkoutInitiatedEventProducer-out-0:
          destination: checkout-initiated
          producer:
            partition-key-expression: headers['sagaId']
        inventoryReservedEventConsumer-in-0:
          destination: inventory-reserved
          group: cart-checkout-saga
          consumer:
            startOffset: latest
        inventoryReservationFailedEventConsumer-in-0:
          destination: inventory-failed
          group: cart-checkout-saga
          consumer:
            startOffset: latest
        checkoutCompletedEventProducer-out-0:
          destination: checkout-completed
          producer:
            partition-key-expression: headers['sagaId']
        checkoutFailedEventProducer-out-0:
          destination: checkout-failed
          producer:
            partition-key-expression: headers['sagaId']
        checkoutCompensatingEventProducer-out-0:
          destination: compensation-triggered
          producer:
            partition-key-expression: headers['sagaId']
        checkoutCompensatedEventConsumer-in-0:
          destination: compensation-completed
          group: cart-checkout-saga
          consumer:
            startOffset: latest
        # Original cart events
        cartEventProducer-out-0:
          destination: cart-events

    # Eureka Client for service discovery
    client:
      register-with-eureka: true
      fetch-registry: true
      service-url:
        defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000
        loggerLevel: BASIC
    circuitbreaker:
      enabled: true
    compression:
      request:
        enabled: true
      response:
        enabled: true

server:
  port: 8084
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      products-getProduct:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        recordable-exceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpClientErrorException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
