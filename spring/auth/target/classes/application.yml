spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: auth_user
    password: auth_user
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8082
  servlet:
    context-path: /

auth:
  jwt-secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits-long-key-here-make-it-secure}
  jwt-issuer: auth-service
  jwt-audience: ecom-api
  access-token-expire-minutes: 15
  refresh-token-expire-days: 7
  google-oauth2-client-id: ${GOOGLE_OAUTH2_CLIENT_ID:}
  google-oauth2-client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET:}
  google-oauth2-redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI:http://localhost:8082/api/v1/auth/sso/google/callback}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
