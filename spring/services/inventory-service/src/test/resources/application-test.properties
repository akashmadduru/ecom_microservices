# Test Configuration
spring.application.name=inventory-service-test
server.port=0

# PostgreSQL Test Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom_inventory_test
spring.datasource.username=test_user
spring.datasource.password=test_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# Flyway (disable for tests - use Hibernate DDL)
spring.flyway.enabled=false

# Kafka Configuration (optional, can be mocked in tests)
spring.kafka.bootstrap-servers=localhost:9092

# Logging
logging.level.com.ecom=DEBUG
logging.level.org.hibernate=INFO
