# Test Configuration
spring.application.name=products-service-test
server.port=0

# PostgreSQL Test Database (will use TestContainers)
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom_product_test
spring.datasource.username=test_user
spring.datasource.password=test_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL15Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# Flyway (disable for tests - use Hibernate DDL)
spring.flyway.enabled=false

# Embedded Redis for Caching Tests
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis

# Kafka Configuration (optional for tests, can be mocked)
spring.kafka.bootstrap-servers=localhost:9092

# Disable security autoconfiguration for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.user.name=testuser
spring.security.user.password=testpass

# Logging
logging.level.com.ecom=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=INFO
