spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ecom_auth_dev
    username: postgres
    password: password
  redis:
    url: redis://localhost:6379
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/dev

logging:
  level:
    root: INFO
    com.ecom: DEBUG

auth:
  jwt:
    secret: dev-secret-key-min-32-chars-required
