spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecom_auth_staging}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:password}
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/staging

logging:
  level:
    root: WARN
    com.ecom: INFO

auth:
  jwt:
    secret: ${JWT_SECRET:staging-secret-key-min-32-chars-required}
