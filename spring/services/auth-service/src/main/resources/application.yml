spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        jdbc:
          batch_size: 20
          fetch_size: 50
          use_getGeneratedKeys: true
        order_inserts: true
        order_updates: true
        cache:
          use_second_level_cache: false
        generate_statistics: false
        use_query_cache: false
        enable_lazy_load_no_trans: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecom_auth}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/${ENV:dev}

auth:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}
    algorithm: ${JWT_ALGORITHM:HS256}
    issuer: ${JWT_ISSUER:ecom-auth-service}
    audience: ${JWT_AUDIENCE:ecom-api}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}

server:
  port: ${AUTH_SERVICE_PORT:8001}
  servlet:
    context-path: /

resilience4j:
  ratelimiter:
    instances:
      authServiceLimiter:
        limitRefreshPeriod: 1m
        limitForPeriod: 100
        timeoutDuration: 5s
      loginLimiter:
        limitRefreshPeriod: 1m
        limitForPeriod: 10
        timeoutDuration: 5s

logging:
  level:
    root: INFO
    com.ecom: DEBUG
    io.github.resilience4j: INFO
