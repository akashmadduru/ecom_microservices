spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecom_auth}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}
    access-token-expire-mins: 15
    refresh-token-expire-days: 7

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.ecom: DEBUG
