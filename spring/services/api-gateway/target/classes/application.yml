spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8001
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: http://localhost:8002
          predicates:
            - Path=/products/**
        - id: inventory-service
          uri: http://localhost:8003
          predicates:
            - Path=/inventory/**

auth:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.ecom: DEBUG
