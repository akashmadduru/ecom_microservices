spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        # Products Service - public endpoint
        - id: products
          uri: http://products-service:8083
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=2

        # Cart Service - protected endpoint
        - id: cart
          uri: http://cart-service:8084
          predicates:
            - Path=/api/v1/carts/**
          filters:
            - StripPrefix=2

        # Inventory Service - protected endpoint
        - id: inventory
          uri: http://inventory-service:8085
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=2

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:8080
              - http://localhost:8081
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: '*'
            allow-credentials: true
            max-age: 3600

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 5000

server:
  port: 8080

auth:
  jwt-secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits-long-key-here-make-it-secure}
  jwt-issuer: auth-service
  jwt-audience: ecom-api

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      products-service:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        recordable-exceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpClientErrorException
      cart-service:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        recordable-exceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpClientErrorException
      inventory-service:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        wait-duration-in-open-state: 30000ms
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        recordable-exceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpClientErrorException
